packages:
  - apps/*
  - libs/*
  - tools/*

peerDependencyRules:
  allowedVersions:
    '@angular/core': '22'
    '@angular/common': '22'
    '@angular/compiler': '22'
    '@angular/compiler-cli': '22'
    '@angular/forms': '22'
    '@angular/platform-browser': '22'
    '@angular/platform-browser-dynamic': '22'
    '@angular/platform-server': '22'
    '@angular/router': '22'
    '@angular/animations': '22'
    '@angular/cdk': '22'
    '@angular/material': '22'
    '@angular/build': '22'
    '@angular-devkit/build-angular': '22'
    '@angular-devkit/core': '22'
    '@angular-devkit/schematics': '22'
    '@schematics/angular': '22'
    ng-packagr: '22'

overrides:
  node-forge: '^1.4.0'
  axios: '>=1.15.2'
  '@hono/node-server': '>=1.19.13'
  ajv@8: '>=8.18.0'
  adm-zip: '>=0.6.0'
  brace-expansion@2: '>=2.0.3'
  brace-expansion@5: '>=5.0.6'
  flatted: '>=3.4.2'
  follow-redirects: '>=1.16.0'
  hono: '>=4.12.30'
  koa: '>=3.1.2'
  lodash-es: '>=4.18.0'
  minimatch@9: '>=9.0.7'
  minimatch@10: '>=10.2.3'
  path-to-regexp@0: '~0.1.13'
  path-to-regexp@8: '>=8.4.0'
  picomatch@2: '>=2.3.2'
  picomatch@4: '>=4.0.4'
  qs: '>=6.15.2'
  rollup: '>=4.59.0'
  serialize-javascript: '>=7.0.5'
  shell-quote: '>=1.8.4'
  tar: '>=7.5.11'
  webpack: '>=5.104.1'
  yaml@2: '>=2.8.3'
  vite@6: '>=6.4.2'
  '@sigstore/core': '>=3.2.1 <4'
  dompurify: '>=3.4.12'
  esbuild: '>=0.28.1'
  fast-uri: '>=4.1.1'
  http-proxy-middleware: '>=3.0.7 <4'
  js-yaml@3: '>=3.15.0 <4'
  js-yaml@4: '>=4.3.0 <5'
  sigstore: '>=4.1.1 <5'
  undici: '>=7.28.0 <8'
  uuid@11: '>=11.1.1 <12'
  ip-address: '>=10.1.1'
  '@babel/plugin-transform-modules-systemjs': '>=7.29.4'
  ws: '>=8.20.1'
  webpack-dev-server: '>=5.2.4'
  uuid@8: '>=12.0.1'

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  less: false
  lmdb: true
  msgpackr-extract: true
  nx: true
  oxc-resolver: true
  unrs-resolver: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - '@tailwindcss/oxide'
  - esbuild
  - lmdb
  - msgpackr-extract
  - nx
  - oxc-resolver
  - unrs-resolver

minimumReleaseAgeExclude:
  - '@angular-eslint/builder@22.0.0'
  - '@angular-eslint/bundled-angular-compiler@22.0.0'
  - '@angular-eslint/eslint-plugin-template@22.0.0'
  - '@angular-eslint/eslint-plugin@22.0.0'
  - '@angular-eslint/schematics@22.0.0'
  - '@angular-eslint/template-parser@22.0.0'
  - '@angular-eslint/utils@22.0.0'
  - angular-eslint@22.0.0
  - '@module-federation/vite@1.16.7'
