version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]
      ngrx:
        patterns: ["@ngrx/*"]
      nx:
        patterns: ["@nx/*", "nx"]
      material:
        patterns: ["@angular/material", "@angular/cdk"]
      all-deps:
        patterns: ["*"]
    ignore:
      # TS 7 calls TS APIs removed from nx 23.1.1; wait for a compatible nx before proposing majors
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
